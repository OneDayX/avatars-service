<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GophProfile — галерея</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6fb;color:#182033}main{max-width:1000px;margin:40px auto;padding:24px}a{color:#4359d9}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:28px}.card{padding:16px;background:white;border-radius:14px;box-shadow:0 6px 24px #18203312}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#e9edf5}.status{font-size:.9rem;color:#667085}.button{display:inline-block;padding:10px 16px;background:#5167e8;color:white;border-radius:8px;text-decoration:none}
</style></head><body><main><a class="button" href="/web/upload?user_id={{.UserID}}">Загрузить ещё</a><h1>Аватары {{.UserID}}</h1>{{if not .Avatars}}<p>У пользователя пока нет аватаров.</p>{{end}}<div class="grid">{{range .Avatars}}<article class="card"><img src="{{.URL}}?size=300x300" onerror="this.onerror=null;this.src='{{.URL}}'" alt="Аватар {{.ID}}"><p class="status">Статус: {{.ProcessingStatus}}</p><p><a href="{{.URL}}">Оригинал</a> · <a href="/api/v1/avatars/{{.ID}}/metadata">Метаданные</a></p></article>{{end}}</div></main></body></html>
