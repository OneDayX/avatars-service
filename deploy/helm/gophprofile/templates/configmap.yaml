apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophprofile.fullname" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.environment | quote }}
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":8081"
  MIGRATIONS_DIR: "migrations"
  WEB_DIR: "web"
  RUN_MIGRATIONS: {{ .Values.config.runMigrations | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_USE_SSL: {{ .Values.config.s3UseSSL | quote }}
  MAX_FILE_SIZE: {{ .Values.config.maxFileSize | quote }}
  RATE_LIMIT_REQUESTS: {{ .Values.config.rateLimitRequests | quote }}
  RATE_LIMIT_WINDOW: {{ .Values.config.rateLimitWindow | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  SHUTDOWN_TIMEOUT: {{ .Values.config.shutdownTimeout | quote }}
  WORKER_MAX_RETRIES: {{ .Values.config.workerMaxRetries | quote }}
  WORKER_RETRY_DELAY: {{ .Values.config.workerRetryDelay | quote }}
  OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
