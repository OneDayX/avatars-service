global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gophprofile-server
    static_configs:
      - targets: ["server:8080"]
  - job_name: gophprofile-worker
    static_configs:
      - targets: ["worker:8081"]
