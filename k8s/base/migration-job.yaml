apiVersion: batch/v1
kind: Job
metadata:
  name: avatar-migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: avatar-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: avatars-service:latest
          imagePullPolicy: IfNotPresent
          command: ["./migrate"]
          envFrom:
            - configMapRef:
                name: avatar-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: avatar-secrets
                  key: database-url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
