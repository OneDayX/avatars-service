apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avatar-server
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: avatars.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avatar-server
                port:
                  name: http
