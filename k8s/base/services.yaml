apiVersion: v1
kind: Service
metadata:
  name: avatar-server
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: avatar-worker
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
