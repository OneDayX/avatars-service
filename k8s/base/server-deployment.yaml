apiVersion: apps/v1
kind: Deployment
metadata:
  name: avatar-server
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: avatar-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: avatars-service:latest
          imagePullPolicy: IfNotPresent
          command: ["./server"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: avatar-config
          env:
            - name: OTEL_SERVICE_NAME
              value: gophprofile-server
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: avatar-secrets
                  key: database-url
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: avatar-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: avatar-secrets
                  key: s3-secret-key
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: avatar-secrets
                  key: rabbitmq-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
